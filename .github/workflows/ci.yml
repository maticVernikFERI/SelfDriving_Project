name: ROS 2 Python CI

on:
  push:
    branches: [main, Developement, Realase-v1.0 ]
  pull_request:
    branches: [main, Developement, Realase-v1.0 ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04  # Jazzy officially targets Ubuntu 24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up ROS 2
      uses: ros-tooling/setup-ros@v0.7
      with:
        required-ros-distributions: jazzy

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y python3-colcon-common-extensions python3-pytest-cov python3-pip
        pip3 install flake8
        pip3 install pynput

    - name: Build ROS 2 workspace
      run: |
        source /opt/ros/jazzy/setup.bash
        cd project_ROS2_ws
        colcon build --packages-select $(colcon list --names-only)

    - name: Test ROS 2 workspace
      run: |
        source /opt/ros/jazzy/setup.bash
        cd project_ROS2_ws
        source install/setup.bash 
        pytest -s -v src/car_controls/test/test_keyboard_control.py
